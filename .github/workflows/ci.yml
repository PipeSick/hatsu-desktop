name: ci

# Validación NO interactiva en runners de GitHub. No publica versiones, no crea releases, no escribe en el repositorio.
on:
  push:
    branches: ["claude/**", "fix/**", "main", "feat/**"]
    paths-ignore: ["docs/**", "*.md"]   # solo documentación: no lanza (ni cancela) una validación
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows · restaurar, compilar, probar, publicar artefactos
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      bin_url: ${{ steps.up_bin.outputs.artifact-url }}
      report_url: ${{ steps.up_report.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Entorno
        shell: pwsh
        run: |
          dotnet --info
          (cmd /c ver)
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-Table | Out-String
      - name: Restaurar, compilar, probar, publicar
        shell: pwsh
        run: ./tools/ci/Invoke-Ci.ps1 -Configuration Release
      - name: Análisis sintáctico de scripts PowerShell
        if: always()
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem tools -Recurse -Filter *.ps1) {
            $e = $null; $t = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            if ($e) { $e | ForEach-Object { Write-Host "::error file=$($f.FullName)::$($_.Message)" }; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Subir informe (logs, binlog, trx)
        id: up_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report
          retention-days: 14
      - name: Subir binarios de prototipos (artefacto temporal, NO es una versión oficial)
        id: up_bin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winmac-binarios-${{ github.sha }}
          path: ci-publish
          retention-days: 14
          if-no-files-found: warn

  windows-host:
    name: Windows · pruebas técnicas del host (ciclo de vida, supervisión, cierre)
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: winmac-binarios-${{ github.sha }}
          path: ci-publish
      - name: Host con módulos de prueba (arranque, reinicios, cierre ordenado, inicio automático de prueba)
        shell: pwsh
        run: ./tools/ci/Test-Host.ps1 -PublishDir ci-publish -OutDir host-out

  windows-integracion:
    name: Windows · integración con NotchWin (Build-Local, WinUI 3, arranque bajo el host)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Clonar NotchWin en ruta corta, con el submódulo, en el commit fijado (tools/notch-pin.txt)
        shell: pwsh
        run: |
          $sha = (Get-Content tools/notch-pin.txt | Where-Object { $_ -and -not $_.StartsWith('#') } | Select-Object -First 1).Trim()
          git clone --no-checkout https://github.com/PipeSick/notch-win C:\nw
          git -C C:\nw fetch origin $sha
          git -C C:\nw checkout --detach $sha
          git -C C:\nw submodule update --init
          git -C C:\nw submodule status
      - name: Build-Local.ps1 (host, Barra, Dock y NotchWin en dist/WinMac)
        shell: pwsh
        run: ./tools/Build-Local.ps1 -NotchPath C:\nw
      - name: Pruebas de NotchWin, arranque real bajo el host y cierre ordenado
        shell: pwsh
        run: ./tools/ci/Test-Notch.ps1 -DistDir dist/WinMac -NotchPath C:\nw -OutDir notch-out
      - name: "Capturas del mezclador con datos de muestra (pintor real fuera de pantalla, NO es validación en hardware)"
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force capturas-mezclador | Out-Null
          foreach ($k in 'mixer', 'mixer-routing') { foreach ($t in 'dark', 'light') { foreach ($sc in '1', '1.5') {
            $png = "capturas-mezclador/$k-$t-$sc.png"
            $p = Start-Process -FilePath (Resolve-Path dist/WinMac/HatsuDesktop.Bar.exe).Path -ArgumentList @('--render-panel', $k, '--theme', $t, '--scale', $sc, '--out', "`"$png`"") -PassThru -Wait -WindowStyle Hidden
            Write-Host "$k $t x$sc -> código $($p.ExitCode), existe=$(Test-Path $png)"
            if ($p.ExitCode -ne 0 -or -not (Test-Path $png)) { throw "No se pudo renderizar $k ($t, x$sc)" }
          } } }
      - name: "Subir capturas del mezclador (muestras de CI, no son tu PC)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-mezclador-${{ github.sha }}
          path: capturas-mezclador
          retention-days: 14
          if-no-files-found: warn
      - name: "Capturas de la iteración 8 en tema claro y oscuro (datos de MUESTRA, NO es validación en hardware). Si falta UNA, el paso falla"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force capturas-it8 | Out-Null
          $bar = (Resolve-Path dist/WinMac/HatsuDesktop.Bar.exe).Path; $host_ = (Resolve-Path dist/WinMac/HatsuDesktop.exe).Path; $dock = (Resolve-Path dist/WinMac/HatsuDesktop.Dock.exe).Path
          $jobs = @()
          foreach ($t in 'dark', 'light') {
            foreach ($d in 'shutdown', 'restart', 'logoff', 'forcequit', 'clear-notifications', 'notice') { $jobs += ,@($bar, "capturas-it8/dialogo-$d-$t.png", '--render-dialog', $d, '--theme', $t, '--scale', '2') }
            foreach ($k in 'phone', 'phone-off', 'phone-unknown', 'apple', 'battery', 'peripherals', 'peripherals-empty', 'cleanup-idle', 'cleanup', 'cleanup-scanning', 'cleanup-done') { $jobs += ,@($bar, "capturas-it8/panel-$k-$t.png", '--render-panel', $k, '--theme', $t, '--scale', '2') }
            $jobs += ,@($bar, "capturas-it8/acerca-$t.png", '--render-about', '--theme', $t, '--scale', '2')
            $jobs += ,@($bar, "capturas-it8/acerca-detalles-$t.png", '--render-about', '--theme', $t, '--scale', '2', '--expanded')
            $jobs += ,@($host_, "capturas-it8/ventana-principal-$t.png", '--render-tray-panel', '--theme', $t, '--scale', '2')
            foreach ($pose in 'rest', 'hover') { $jobs += ,@($dock, "capturas-it8/dock-$pose-$t.png", '--render-png', "capturas-it8/dock-$pose-$t.png", '--pose', $pose, '--theme', $t, '--scale', '2') }
          }
          $failed = @()
          foreach ($j in $jobs) {
            $exe = $j[0]; $out = $j[1]; $rest = $j[2..($j.Count - 1)]
            $a = @(); foreach ($x in $rest) { $a += $x }
            if ($exe -ne $dock) { $a += '--out'; $a += "`"$out`"" }
            $p = Start-Process -FilePath $exe -ArgumentList $a -PassThru -Wait -WindowStyle Hidden
            $ok = ($p.ExitCode -eq 0) -and (Test-Path $out) -and ((Get-Item $out).Length -gt 2000)
            Write-Host "$out -> código $($p.ExitCode), existe=$(Test-Path $out), ok=$ok"
            if (-not $ok) { $failed += $out }
          }
          if ($failed.Count -gt 0) { throw "Faltan capturas obligatorias ($($failed.Count)): $($failed -join ', ')" }
          Write-Host "Capturas generadas: $($jobs.Count)"
      - name: Subir capturas de la iteración 8
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-it8-${{ github.sha }}
          path: capturas-it8
          retention-days: 14
          if-no-files-found: error
      - name: Subir resultados de la integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integracion-notchwin-${{ github.sha }}
          path: notch-out
          retention-days: 14
          if-no-files-found: warn
      - name: Paquete de la beta privada (zip reproducible y verificado; NO se publica ninguna versión)
        shell: pwsh
        run: |
          ./tools/Package-WinMac.ps1 -DistDir dist/WinMac -OutDir paquete
          $first = Get-Content (Get-ChildItem paquete -Filter *.sha256 | Select-Object -First 1).FullName
          Remove-Item paquete -Recurse -Force
          ./tools/Package-WinMac.ps1 -DistDir dist/WinMac -OutDir paquete
          $second = Get-Content (Get-ChildItem paquete -Filter *.sha256 | Select-Object -First 1).FullName
          Write-Host "Reproducible (dos empaquetados del mismo commit, mismo SHA-256): $($first -eq $second)"
          Write-Host "Primero:  $first"; Write-Host "Segundo:  $second"
          # Desinstalación limpia en este runner: sin -RemoveFolder; comprueba que el inicio automático y los datos se quitan
          if (-not (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run')) { New-Item -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Force | Out-Null }   # algunos runners no traen la clave
          New-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'WinMac' -Value 'x' -Force | Out-Null
          ./dist/WinMac/Uninstall-HatsuDesktop.ps1 -RemoveData
          $runLeft = [bool](Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -Name 'WinMac' -ErrorAction SilentlyContinue)
          Write-Host "Tras desinstalar: inicio automático presente=$runLeft; datos presentes=$(Test-Path (Join-Path $env:APPDATA 'WinMac'))/$(Test-Path (Join-Path $env:LOCALAPPDATA 'WinMac'))"
          if ($first -ne $second) { throw 'El empaquetado no es reproducible' }
          if ($runLeft) { throw 'La desinstalación dejó el inicio automático' }
          ./tools/ci/Verify-Package.ps1 -Zip (Get-ChildItem paquete -Filter *.zip | Select-Object -First 1).FullName
      - name: "Simulación de la transición desde WinMac en el runner (entorno SIMULADO: NO es una actualización real en tu Windows)"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'; if (-not (Test-Path $run)) { New-Item -Path $run -Force | Out-Null }
          $new = (Resolve-Path dist/WinMac/HatsuDesktop.exe).Path
          $oldDir = Join-Path $env:RUNNER_TEMP 'WinMac antigua'; New-Item -ItemType Directory -Force $oldDir | Out-Null
          Copy-Item "$env:SystemRoot\System32\more.com" (Join-Path $oldDir 'WinMac.exe')   # solo importa que EXISTA (otra instalación «viva», con espacios en la ruta)
          function Val { (Get-ItemProperty -Path $run -Name 'WinMac' -ErrorAction SilentlyContinue).WinMac }
          function Adopt { Start-Process -FilePath $new -ArgumentList '--adopt-autostart' -Wait -WindowStyle Hidden }
          $fail = 0; function Check([string]$n, [bool]$ok, [string]$d = '') { if ($ok) { Write-Host "PASS  $n $d" } else { Write-Host "FAIL  $n $d"; $script:fail++ } }
          try {
            # 1. desactivado sigue desactivado (nunca se crea)
            Remove-ItemProperty -Path $run -Name 'WinMac' -ErrorAction SilentlyContinue; Adopt
            Check 'inicio automático desactivado sigue desactivado' ($null -eq (Val))
            # 2. apunta a otra instalación viva: la simulación (sin -Apply) no cambia nada; --adopt-autostart sí, conservando los argumentos
            $old = "`"$oldDir\WinMac.exe`" --background --prueba"; Set-ItemProperty -Path $run -Name 'WinMac' -Value $old
            & pwsh -NoProfile -File (Join-Path (Split-Path $new) 'Migrate-FromWinMac.ps1') | Out-Null
            Check 'Migrate-FromWinMac sin -Apply no cambia nada' ((Val) -eq $old)
            Adopt; $v = Val
            Check 'adopción: apunta a esta instalación y conserva los argumentos' ($v -eq "`"$new`" --background --prueba") "valor: $v"
            Adopt; Check 'idempotente: repetir no cambia el valor' ((Val) -eq $v)
            # 3. huérfano (carpeta antigua borrada)
            Set-ItemProperty -Path $run -Name 'WinMac' -Value '"C:\no existe\WinMac.exe" --background'; Adopt
            Check 'valor huérfano: pasa a esta instalación' ((Val) -eq "`"$new`" --background") "valor: $(Val)"
            # 4. valor ilegible: no se toca
            Set-ItemProperty -Path $run -Name 'WinMac' -Value 'cosa-rara'; Adopt
            Check 'valor ilegible: no se toca' ((Val) -eq 'cosa-rara')
            # 5. -Apply del script de ayuda (con una instancia inexistente): adopta y no crea una segunda entrada
            Set-ItemProperty -Path $run -Name 'WinMac' -Value $old
            & pwsh -NoProfile -File (Join-Path (Split-Path $new) 'Migrate-FromWinMac.ps1') -Apply | Out-Null
            Check 'Migrate-FromWinMac -Apply adopta el inicio automático' ((Val) -like "*$new*--background --prueba")
            $names = (Get-Item $run).Property | Where-Object { $_ -match 'WinMac|Hatsu' }
            Check 'una sola entrada de inicio automático (WinMac); ninguna «Hatsu Desktop»' (@($names).Count -eq 1 -and $names -eq 'WinMac') "entradas: $($names -join ', ')"
          } finally { Remove-ItemProperty -Path $run -Name 'WinMac' -ErrorAction SilentlyContinue; Remove-Item -Recurse -Force $oldDir -ErrorAction SilentlyContinue }
          if ($fail -gt 0) { throw "$fail comprobación(es) de la transición fallaron" }
      - name: Capturas del asistente de primera ejecución en tema claro y oscuro (pantallas con elecciones y fallos de MUESTRA, NO es validación en hardware ni de ratón/foco). Si falta UNA, el paso falla
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force capturas-onboarding/escalas | Out-Null; $exe = (Resolve-Path dist/WinMac/HatsuDesktop.exe).Path; $failed = @()
          function Render([string]$step, [string]$theme, [string]$scale, [string]$png, [string[]]$extra = @()) {
            $p = Start-Process $exe -ArgumentList (@('--render-onboarding', $step, '--out', "`"$png`"", '--theme', $theme, '--scale', $scale) + $extra) -Wait -PassThru -WindowStyle Hidden
            $ok = ($p.ExitCode -eq 0) -and (Test-Path $png) -and ((Get-Item $png).Length -gt 5000)
            $info = if (Test-Path "$png.txt") { (Get-Content "$png.txt" -Raw).Trim() } else { '' }
            Write-Host "$png -> código $($p.ExitCode), ok=$ok  $info"; if (-not $ok) { $script:failed += $png }
          }
          # las 12 capturas de revisión (6 pantallas × claro y oscuro, escala 2)
          foreach ($theme in 'light', 'dark') { foreach ($step in 'Welcome', 'Components', 'Appearance', 'Windows', 'Review', 'Result') { Render $step $theme '2' "capturas-onboarding/asistente-$($step.ToLower())-$theme.png" } }
          # Fase 3.1: la bienvenida de migración (usuario que ya tenía WinMac/Hatsu configurado)
          foreach ($theme in 'light', 'dark') { Render 'Welcome' $theme '2' "capturas-onboarding/asistente-bienvenida-migracion-$theme.png" @('--migration') }
          # otros escalados (100 %, 125 %, 150 %) de las dos pantallas con más texto + el detalle técnico de la pantalla final
          foreach ($theme in 'light', 'dark') { foreach ($sc in '1', '1.25', '1.5') { foreach ($step in 'Appearance', 'Result') { Render $step $theme $sc "capturas-onboarding/escalas/asistente-$($step.ToLower())-$theme-x$sc.png" } }
            Render 'Result' $theme '1.5' "capturas-onboarding/escalas/asistente-result-detalles-$theme-x1.5.png" @('--details') }
          if ($failed.Count -gt 0) { throw "Faltan capturas del asistente ($($failed.Count)): $($failed -join ', ')" }
          # Volcado de revisión: JPEG reducido en el registro del job (para poder REVISAR las capturas sin descargar el artefacto). Solo diagnóstico.
          Add-Type -AssemblyName System.Drawing
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object MimeType -eq 'image/jpeg'
          $ep = New-Object System.Drawing.Imaging.EncoderParameters(1); $ep.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter([System.Drawing.Imaging.Encoder]::Quality, [long]82)
          foreach ($f in (Get-ChildItem capturas-onboarding -Recurse -Filter *.png | Where-Object { $_.Directory.Name -ne 'escalas' -or $_.Name -match 'x1\.png|detalles' })) {
            $img = [System.Drawing.Image]::FromFile($f.FullName); $w = 1000; $h = [int]($img.Height * $w / $img.Width); $bmp = New-Object System.Drawing.Bitmap $w, $h
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.InterpolationMode = 'HighQualityBicubic'; $g.DrawImage($img, 0, 0, $w, $h); $g.Dispose(); $img.Dispose()
            $ms = New-Object System.IO.MemoryStream; $bmp.Save($ms, $codec, $ep); $bmp.Dispose()
            Write-Host ("IMGDUMP {0} {1}" -f $f.Name, [Convert]::ToBase64String($ms.ToArray()))
          }
      - name: Subir capturas del asistente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-onboarding-${{ github.sha }}
          path: capturas-onboarding
          retention-days: 14
          if-no-files-found: error
      - name: Instalar WiX (código abierto, MS-RL) para construir el MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2
          wix --version
      - name: MSI de Hatsu Desktop (compilación; NO se publica ninguna versión)
        shell: pwsh
        run: ./installer/Build-Msi.ps1 -DistDir dist/WinMac -OutDir paquete -Compression medium
      - name: "Verificación de firmas (INFORMATIVA hoy: nada propio está firmado; pasa a obligatoria con -Require cuando exista certificado)"
        shell: pwsh
        run: ./tools/ci/Verify-Signatures.ps1 -DistDir dist/WinMac -Msi (Get-ChildItem paquete -Filter *.msi | Select-Object -First 1).FullName
      - name: Auditoría de binarios y del MSI (firma Authenticode, cabeceras PE, metadatos; solo lectura)
        shell: pwsh
        run: |
          $msi = (Get-ChildItem paquete -Filter *.msi | Select-Object -First 1).FullName
          ./tools/ci/Audit-Binaries.ps1 -DistDir dist/WinMac -Msi $msi -Out paquete/auditoria-binarios.md
          Get-Content paquete/auditoria-binarios.md -Raw | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: "MSI: instalación, actualización y desinstalación REALES en el runner (entorno efímero de CI: NO es una prueba en un Windows físico)"
        shell: pwsh
        run: ./tools/ci/Test-Msi.ps1 -DistDir dist/WinMac -OutDir msi-test
      - name: Subir el informe y los registros del MSI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msi-informe-${{ github.sha }}
          path: |
            msi-test/msi-report.md
            msi-test/*.log
          retention-days: 14
          if-no-files-found: warn
      - name: "Reserva del borde superior: la Barra reserva el área de trabajo de Windows y la devuelve (runner efímero: NO es un PC real, un monitor, sin iconos)"
        if: always()
        shell: pwsh
        run: ./tools/ci/Test-Appbar.ps1 -BarExe dist/WinMac/HatsuDesktop.Bar.exe -OutDir appbar-test
      - name: Subir el informe de la reserva del borde superior
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appbar-informe-${{ github.sha }}
          path: appbar-test
          retention-days: 14
          if-no-files-found: warn
      - name: "MSIX con la identidad OFICIAL de Partner Center: artefacto SIN FIRMAR para la Store + copia firmada con certificado de PRUEBA solo para instalarla en este runner (NO prueba nada sobre Smart App Control; el MSI no se toca)"
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          ./installer/msix/Build-Msix.ps1 -DistDir dist/WinMac -OutDir msix-out -Variant Default -Sign
          ./tools/ci/Test-Msix.ps1 -Package (Get-ChildItem msix-out -Filter '*-citest-signed.msix' | Select-Object -First 1).FullName -Cert msix-out/ci-test.cer -OutDir msix-test -Label Default
          Get-ChildItem msix-test -Filter 'msix-report-*.md' | ForEach-Object { Get-Content $_.FullName -Raw | Add-Content $env:GITHUB_STEP_SUMMARY }
      - name: "Subir el informe MSIX (sin paquetes)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-informe-${{ github.sha }}
          path: |
            msix-test
            !msix-test/*.json
          retention-days: 14
          if-no-files-found: warn
      - name: "Subir el MSIX SIN FIRMAR para Partner Center (artefacto temporal; NO es una versión publicada ni se envía a certificación)"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: msix-store-sin-firmar-${{ github.sha }}
          path: |
            msix-out/*-store-unsigned.msix
            msix-out/*-store-unsigned.msix.sha256
          retention-days: 14
          if-no-files-found: warn
      - name: "MSIX de llamadas completas (docs/60): variante A = Stable + phoneCall (general); variante B = A + phoneLineTransportManagement (RESTRINGIDA, requiere aprobación de Microsoft). SIN FIRMAR; comprueba identidad y capacidades exactas. No se publican ni se envían"
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($v in @(@{ Variant = 'PhoneCall'; Filter = '*-beta-phonecall-unsigned.msix'; Restricted = @('runFullTrust') }, @{ Variant = 'CallControl'; Filter = '*-beta-callcontrol-unsigned.msix'; Restricted = @('runFullTrust', 'phoneLineTransportManagement') })) {
            ./installer/msix/Build-Msix.ps1 -DistDir dist/WinMac -OutDir msix-out -Variant $v.Variant
            $pkg = Get-ChildItem msix-out -Filter $v.Filter | Select-Object -First 1
            $zip = [IO.Compression.ZipFile]::OpenRead($pkg.FullName); try { $rd = New-Object IO.StreamReader($zip.GetEntry('AppxManifest.xml').Open()); [xml]$mx = $rd.ReadToEnd(); $rd.Dispose() } finally { $zip.Dispose() }
            $all = @($mx.Package.Capabilities.ChildNodes | ForEach-Object { $_.Prefix + ':' + $_.GetAttribute('Name') })
            Write-Host ("[$($v.Variant)] capacidades: " + ($all -join ', '))
            if (-not ($mx.Package.Capabilities.InnerXml -match 'Name="phoneCall"')) { throw "Falta phoneCall en $($v.Variant)" }
            $restricted = @($mx.Package.Capabilities.ChildNodes | Where-Object { $_.NamespaceURI -like '*restrictedcapabilities*' } | ForEach-Object { $_.GetAttribute('Name') } | Sort-Object)
            if ((($restricted -join ',')) -ne (($v.Restricted | Sort-Object) -join ',')) { throw "Capacidades restringidas inesperadas en $($v.Variant): $($restricted -join ',')" }
            if ($mx.Package.Identity.Name -ne 'PipeSick.HatsuDesktop' -or $mx.Package.Identity.Publisher -ne 'CN=ACC0FCB8-4D92-4E20-9731-7254D5E43289') { throw "Identidad incorrecta en $($v.Variant)" }
            Write-Host "[$($v.Variant)] OK identidad conservada · v$($mx.Package.Identity.Version) · SHA-256 $((Get-FileHash $pkg.FullName -Algorithm SHA256).Hash.ToLowerInvariant())"
          }
      - name: "Subir los MSIX de llamadas completas (artefactos temporales; NO son una versión publicada ni se envían a certificación)"
        uses: actions/upload-artifact@v4
        with:
          name: msix-llamadas-sin-firmar-${{ github.sha }}
          path: |
            msix-out/*-beta-phonecall-unsigned.msix
            msix-out/*-beta-phonecall-unsigned.msix.sha256
            msix-out/*-beta-callcontrol-unsigned.msix
            msix-out/*-beta-callcontrol-unsigned.msix.sha256
          retention-days: 14
          if-no-files-found: error
      - name: Subir el paquete (artefacto temporal, no es una versión publicada)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hatsu-desktop-paquete-${{ github.sha }}
          path: paquete
          retention-days: 14
          if-no-files-found: warn

  linux-cross:
    name: Linux · compilación cruzada y pruebas de lógica pura (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - shell: pwsh
        run: ./tools/ci/Invoke-Ci.ps1 -Configuration Release -NoPublish
