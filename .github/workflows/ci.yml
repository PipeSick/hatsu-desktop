name: ci

# Validación NO interactiva en runners de GitHub. No publica versiones, no crea releases, no escribe en el repositorio.
on:
  push:
    branches: ["claude/**", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    name: Windows · restaurar, compilar, probar, publicar artefactos
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      bin_url: ${{ steps.up_bin.outputs.artifact-url }}
      report_url: ${{ steps.up_report.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Entorno
        shell: pwsh
        run: |
          dotnet --info
          (cmd /c ver)
          Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-Table | Out-String
      - name: Restaurar, compilar, probar, publicar
        shell: pwsh
        run: ./tools/ci/Invoke-Ci.ps1 -Configuration Release
      - name: Análisis sintáctico de scripts PowerShell
        if: always()
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem tools -Recurse -Filter *.ps1) {
            $e = $null; $t = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$t, [ref]$e)
            if ($e) { $e | ForEach-Object { Write-Host "::error file=$($f.FullName)::$($_.Message)" }; $bad++ }
          }
          if ($bad) { exit 1 }
      - name: Subir informe (logs, binlog, trx)
        id: up_report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report
          path: ci-report
          retention-days: 14
      - name: Subir binarios de prototipos (artefacto temporal, NO es una versión oficial)
        id: up_bin
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winmac-binarios-${{ github.sha }}
          path: ci-publish
          retention-days: 14
          if-no-files-found: warn

  windows-smoke:
    name: Windows · humo del Dock (selftest, PNG, bench)
    needs: windows-build
    runs-on: windows-latest
    # Un fallo aquí SÍ hace fallar el workflow (detección de errores de ejecución). El éxito NO valida lo visual: el runner no tiene monitor/GPU reales.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: winmac-binarios-${{ github.sha }}
          path: ci-publish
      - name: Sonda de plataforma (solo lectura)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          & ci-publish/S7.PlatformProbe/S7.PlatformProbe.exe *> smoke/S7-platform.txt
          Get-Content smoke/S7-platform.txt
      - name: Humo del Dock (selftest, PNG de todas las escenas, bench en WARP)
        shell: pwsh
        run: ./tools/ci/Invoke-Smoke.ps1 -PublishDir ci-publish -OutDir smoke
      - name: Preparar hoja de contacto
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force sheet | Out-Null
          Copy-Item smoke/contact-sheet.png sheet/ -ErrorAction SilentlyContinue
          Copy-Item smoke/preview-*.png sheet/ -ErrorAction SilentlyContinue
      - name: Subir resultados de humo
        id: up_smoke
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ github.sha }}
          path: smoke
          retention-days: 14
          if-no-files-found: warn
      - name: Subir hoja de contacto
        id: up_sheet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dock-hoja-de-contacto-${{ github.sha }}
          path: sheet
          retention-days: 14
          if-no-files-found: warn
      - name: Resumen visual (Job Summary)
        if: always()
        shell: pwsh
        run: ./tools/ci/Write-Summary.ps1 -SmokeDir smoke -SmokeUrl "${{ steps.up_smoke.outputs.artifact-url }}" -SheetUrl "${{ steps.up_sheet.outputs.artifact-url }}" -BinUrl "${{ needs.windows-build.outputs.bin_url }}" -Sha "${{ github.sha }}"

  windows-integracion:
    name: Windows · integración con NotchWin (Build-Local, WinUI 3, arranque bajo el host)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Clonar NotchWin en ruta corta, con el submódulo, en el commit fijado (tools/notch-pin.txt)
        shell: pwsh
        run: |
          $sha = (Get-Content tools/notch-pin.txt | Where-Object { $_ -and -not $_.StartsWith('#') } | Select-Object -First 1).Trim()
          git clone --no-checkout https://github.com/PipeSick/notch-win C:\nw
          git -C C:\nw fetch origin $sha
          git -C C:\nw checkout --detach $sha
          git -C C:\nw submodule update --init
          git -C C:\nw submodule status
      - name: Build-Local.ps1 (host, Barra, Dock y NotchWin en dist/WinMac)
        shell: pwsh
        run: ./tools/Build-Local.ps1 -NotchPath C:\nw
      - name: Pruebas de NotchWin, arranque real bajo el host y cierre ordenado
        shell: pwsh
        run: ./tools/ci/Test-Notch.ps1 -DistDir dist/WinMac -NotchPath C:\nw -OutDir notch-out
      - name: Subir resultados de la integración
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integracion-notchwin-${{ github.sha }}
          path: notch-out
          retention-days: 14
          if-no-files-found: warn

  linux-cross:
    name: Linux · compilación cruzada y pruebas de lógica pura (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - shell: pwsh
        run: ./tools/ci/Invoke-Ci.ps1 -Configuration Release -NoPublish
