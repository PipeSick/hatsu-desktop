name: spikes
on:
  pull_request:
    paths: ["spikes/**"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: dotnet build spikes/WinMac.Spikes.slnx -c Release --nologo
